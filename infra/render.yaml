# Render blueprint.
#
# ⚠️ LEGAL NOTE — read docs/LEGAL.md before using this in production.
# Uzbek law requires personal data of Uzbek citizens to be stored on servers
# located in Uzbekistan. Render's regions do not satisfy that. This blueprint
# is appropriate for demo and testing; production needs local hosting or the
# on-prem bundle in infra/onprem/.
#
# Step-by-step instructions: docs/DEPLOY.md
#
# Frankfurt is the closest region Render offers to Uzbekistan, so every
# service below sets `region: frankfurt` individually. There is no top-level
# `region:` key in a blueprint — putting one there makes the whole file fail
# to parse, and Render reports it as "0 services".
#
# A service's region cannot be changed after creation (the service has to be
# recreated), so decide before the first deploy. All four must match, or the
# private network between them does not work.

services:
  # ── Public API ──────────────────────────────────────────────────────────
  # The only service reachable from the internet. It carries no model and no
  # LibreOffice, which is what keeps the image small and the cold start short.
  - type: web
    name: ocr-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    # The free tier gives 512 MB and spins down after 15 minutes idle. A
    # spun-down API turns a 6-second extraction into a 60-second one.
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # MVP demo: free-tier Gemini keys, real documents refused by the PII
      # gate. Flip to "false" once a paid key and a DPA are in place.
      # Must match the value on ocr-ml — the API renders the user-facing
      # warning from its own setting.
      - key: DEMO_MODE
        value: "true"

      # Secrets: entered in the dashboard on first deploy, never in the repo.
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_TOKEN
        sync: false

      # Neon or Supabase. Render's own free Postgres expires after 30 days,
      # and takes the encrypted extractions with it.
      # Must be the asyncpg driver URL: postgresql+asyncpg://...
      - key: DATABASE_URL
        sync: false

      # S3-compatible object storage (Cloudflare R2 or Backblaze B2).
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

      # The Vercel frontend origin. Chicken-and-egg on the first deploy: put a
      # placeholder here, deploy the frontend, then come back with the real
      # domain. A wrong value shows up as a browser CORS error, not a 500.
      - key: CORS_ORIGINS
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ocr-keyvalue
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: pserv
          name: ocr-ml
          property: hostport
      - key: CONVERTER_URL
        fromService:
          type: pserv
          name: ocr-converter
          property: hostport

      # false hides the PDF button entirely and lets you skip the converter
      # service below.
      - key: ENABLE_PDF_OUTPUT
        value: "true"

  # ── ML inference (private) ──────────────────────────────────────────────
  # Not reachable from the internet: only ocr-api can call it, over Render's
  # private network, and it still checks INTERNAL_TOKEN on every request.
  #
  # The LLM keys live HERE, not on the API. packages/llm runs inside this
  # service — the API never talks to a model provider.
  - type: pserv
    name: ocr-ml
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.ml
    plan: starter
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production

      # Keep in step with ocr-api. In demo mode the cascade routes to the free
      # tier and a genuinely real document is refused rather than sent.
      - key: DEMO_MODE
        value: "true"

      - key: INTERNAL_TOKEN
        sync: false

      # Paid key. Cleared for real personal data. Optional in demo mode.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # FREE Gemini keys. Usable ONLY because DEMO_MODE=true: the gate still
      # refuses anything that looks like a real identity document, so this is
      # a demo-only configuration, not a way around the policy.
      - key: GEMINI_FREE_KEYS
        sync: false

      # Paid Gemini keys, for when demo mode is switched off. Must be
      # DIFFERENT keys from the free ones above.
      - key: GEMINI_PAID_KEYS
        sync: false
      - key: GEMINI_PAID_ENABLED
        value: "false"

      - key: LLM_ENABLED
        value: "true"
      # Left unset so packages/llm/demo.py picks the order from the mode:
      # demo puts gemini-free first, production never does.
      # - key: LLM_PROVIDER_ORDER
      - key: LLM_DAILY_BUDGET_USD
        value: "5.0"

      # Stage L3 sends the document IMAGE to a provider. Off by default: that
      # should be a deliberate decision with a legal basis behind it.
      - key: ENABLE_L3_VISION
        value: "false"

      # The response cache holds model output about real documents, so it is
      # encrypted at rest. Without a key the service refuses to cache in
      # production rather than storing PII in plaintext.
      - key: LLM_CACHE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ocr-keyvalue
          property: connectionString

      # The model is baked into the image at /srv/models by Dockerfile.ml.
      # If models/classifier.onnx has not been committed yet the file is simply
      # absent, the classifier disables itself, and extraction still works.
      # Train it with training/01_classifier.ipynb (Colab T4) and commit the
      # result — no model registry, no download at boot.
      - key: CLASSIFIER_MODEL_PATH
        value: /srv/models/classifier.onnx
      - key: CLASSIFIER_MIN_CONFIDENCE
        value: "0.60"
      - key: CLASSIFIER_MAX_ENERGY
        value: "-2.0"

  # ── Document converter (private, optional) ──────────────────────────────
  # LibreOffice, ~700 MB. Needed only for legacy .doc templates and PDF
  # output. With .docx templates and ENABLE_PDF_OUTPUT=false, delete this
  # service and the CONVERTER_URL reference above.
  - type: pserv
    name: ocr-converter
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.converter
    plan: starter
    region: frankfurt
    envVars:
      - key: INTERNAL_TOKEN
        sync: false

  # ── Key Value (Redis-compatible) ────────────────────────────────────────
  # Backs the LLM response cache. `ipAllowList: []` means no public access at
  # all — only services on this account's private network can connect.
  - type: keyvalue
    name: ocr-keyvalue
    plan: starter
    region: frankfurt
    ipAllowList: []
    # The cache is a cost optimisation, never a source of truth, so evicting
    # under memory pressure is correct. It also bounds how long PII can sit
    # here if a TTL is ever misconfigured.
    maxmemoryPolicy: allkeys-lru
